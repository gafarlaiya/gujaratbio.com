name: Gemini auto-publish
on:
  # Daily schedule switched off (Phase 1, Nov 2026): nothing goes live without the owner's approval.
  # Run by hand: GitHub -> Actions -> "Gemini auto-publish" -> Run workflow. Output lands on a drafts/ branch, never on main.
  # schedule:
  #   - cron: "53 21 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Max new pieces this run (owner rule: 3 per day)"
        default: "3"
permissions:
  contents: write
concurrency:
  group: autopub
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow beautifulsoup4 lxml
      - name: Write, check, illustrate, translate and build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COUNT: ${{ github.event.inputs.count || '3' }}
        run: python3 gemini/autopub.py www
      - name: Save as drafts (owner reviews, QA checks, then merges to main to publish)
        run: |
          git config user.name "GBO auto-publisher"
          git config user.email "sales@gujaratbio.com"
          BR="drafts/autopub-$(date -u +%F-%H%M)"
          git switch -c "$BR"
          git add -A
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Draft (Gemini) $(date -u +%F): for review, not live"
          git push -u origin "$BR"
          echo "Drafts saved on branch $BR. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
